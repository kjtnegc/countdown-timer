<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1.0,

maximum-scale=1.0,

user-scalable=no">

<title>Countdown Timer</title>

<style>

/* =========================

   基本設定

========================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Helvetica Neue",

        sans-serif;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

/* =========================

   メイン画面

========================= */

.container {

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}

/* =========================

   時間表示

========================= */

.time {

    font-size: 22vw;

    font-weight: 300;

    letter-spacing: -0.05em;

    font-variant-numeric:

        tabular-nums;

    white-space: nowrap;

    user-select: none;

}

.time:active {

    opacity: 0.6;

}

/* =========================

   ＋ − ボタン

========================= */

.controls {

    display: flex;

    gap: 25px;

    margin-top: 35px;

}

button {

    border: none;

    background: #222;

    color: white;

    border-radius: 50%;

    width: 65px;

    height: 65px;

    font-size: 32px;

}

button:active {

    background: #555;

}

/* =========================

   START / RESET

========================= */

.main-buttons {

    display: flex;

    gap: 15px;

    margin-top: 30px;

}

.main-buttons button {

    width: 120px;

    height: 55px;

    border-radius: 30px;

    font-size: 18px;

}

/* =========================

   時間設定

========================= */

.setting {

    display: none;

    margin-top: 25px;

    gap: 10px;

    align-items: center;

}

input {

    background: #222;

    color: white;

    border: 1px solid #555;

    border-radius: 10px;

    padding: 12px;

    font-size: 22px;

    width: 90px;

    text-align: center;

}

.setting button {

    width: 80px;

    height: 50px;

    border-radius: 25px;

    font-size: 18px;

}

</style>

</head>

<body>

<div class="container">

    <!-- =====================

         時間表示

    ====================== -->

    <div

        id="time"

        class="time"

        onclick="showSetting()">

        05:00

    </div>

    <!-- =====================

         時間設定

    ====================== -->

    <div

        id="setting"

        class="setting">

        <input

            id="minutes"

            type="number"

            min="0"

            placeholder="分">

        <span>分</span>

        <input

            id="seconds"

            type="number"

            min="0"

            max="59"

            placeholder="秒">

        <span>秒</span>

        <button onclick="setTime()">

            SET

        </button>

    </div>

    <!-- =====================

         ＋ −

    ====================== -->

    <div class="controls">

        <button

            onclick="changeTime(-60)">

            −

        </button>

        <button

            onclick="changeTime(60)">

            ＋

        </button>

    </div>

    <!-- =====================

         START / RESET

    ====================== -->

    <div class="main-buttons">

        <button

            id="startStopButton"

            onclick="toggleTimer()">

            START

        </button>

        <button

            onclick="resetTimer()">

            RESET

        </button>

    </div>

</div>

<script>

/* =========================

   タイマー変数

========================= */

let initialSeconds = 5 * 60;

let remainingSeconds =

    initialSeconds;

let timer = null;

let running = false;

/* =========================

   時間表示

========================= */

function formatTime(seconds) {

    let sign = "";

    /*

       マイナスの場合

    */

    if (seconds < 0) {

        sign = "-";

        seconds =

            Math.abs(seconds);

    }

    const minutes =

        Math.floor(seconds / 60);

    const secs =

        seconds % 60;

    return sign

        + String(minutes)

            .padStart(2, "0")

        + ":"

        + String(secs)

            .padStart(2, "0");

}

/* =========================

   画面更新

========================= */

function updateDisplay() {

    document

        .getElementById("time")

        .textContent =

            formatTime(

                remainingSeconds

            );

}

/* =========================

   ＋ − ボタン

========================= */

function changeTime(amount) {

    /*

       動作中は変更しない

    */

    if (running) {

        return;

    }

    initialSeconds += amount;

    /*

       0秒未満にはしない

    */

    if (initialSeconds < 0) {

        initialSeconds = 0;

    }

    remainingSeconds =

        initialSeconds;

    updateDisplay();

}

/* =========================

   時間設定画面を表示

========================= */

function showSetting() {

    /*

       動作中は設定できない

    */

    if (running) {

        return;

    }

    document

        .getElementById("setting")

        .style.display = "flex";

    /*

       現在の時間を入力欄に表示

    */

    document

        .getElementById("minutes")

        .value =

            Math.floor(

                initialSeconds / 60

            );

    document

        .getElementById("seconds")

        .value =

            initialSeconds % 60;

}

/* =========================

   時間設定

========================= */

function setTime() {

    /*

       動作中は変更しない

    */

    if (running) {

        return;

    }

    const minutes =

        parseInt(

            document

                .getElementById("minutes")

                .value

        ) || 0;

    const seconds =

        parseInt(

            document

                .getElementById("seconds")

                .value

        ) || 0;

    /*

       分 → 秒に変換

    */

    initialSeconds =

        (minutes * 60)

        + seconds;

    remainingSeconds =

        initialSeconds;

    /*

       設定画面を閉じる

    */

    document

        .getElementById("setting")

        .style.display = "none";

    updateDisplay();

}

/* =========================

   START / STOP

========================= */

function toggleTimer() {

    /*

       =====================

       STOP

       =====================

    */

    if (running) {

        clearInterval(timer);

        timer = null;

        running = false;

        document

            .getElementById(

                "startStopButton"

            )

            .textContent = "START";

        return;

    }

    /*

       =====================

       START

       =====================

    */

    running = true;

    document

        .getElementById(

            "startStopButton"

        )

        .textContent = "STOP";

    /*

       1秒ごとに処理

    */

    timer =

        setInterval(function() {

            remainingSeconds--;

            updateDisplay();

            /*

               0秒になっても

               STOPしない

               -01秒

               -02秒

               -03秒

               ...

               と続く

            */

        }, 1000);

}

/* =========================

   RESET

========================= */

function resetTimer() {

    /*

       タイマー停止

    */

    clearInterval(timer);

    timer = null;

    running = false;

    /*

       設定した時間に戻す

    */

    remainingSeconds =

        initialSeconds;

    /*

       ボタン表示をSTARTに戻す

    */

    document

        .getElementById(

            "startStopButton"

        )

        .textContent = "START";

    updateDisplay();

}

/* =========================

   初期表示

========================= */

updateDisplay();

</script>

</body>

</html>
