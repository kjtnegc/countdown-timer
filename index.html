<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1.0,

maximum-scale=1.0,

user-scalable=no">

<title>Countdown Timer</title>

<style>

/* =========================

   基本設定

========================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

html,

body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Helvetica Neue",

        sans-serif;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

/* =========================

   メイン画面

========================= */

.container {

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}

/* =========================

   時間表示

========================= */

.time {

    font-size: 24vw;

    font-weight: 300;

    letter-spacing: -0.05em;

    font-variant-numeric:

        tabular-nums;

    white-space: nowrap;

    user-select: none;

    cursor: pointer;

}

.time:active {

    opacity: 0.5;

}

/* =========================

   横向き表示

========================= */

@media (orientation: landscape) {

    .time {

        font-size: 28vw;

    }

    .set-time-button {

        margin-top: 10px;

    }

    .controls {

        margin-top: 10px;

    }

    .reset-button {

        margin-top: 10px;

    }

}

/* =========================

   時間設定

========================= */

.setting {

    display: none;

    margin-top: 25px;

    gap: 10px;

    align-items: center;

}

input {

    background: #222;

    color: #fff;

    border: 1px solid #555;

    border-radius: 10px;

    padding: 10px;

    font-size: 20px;

    width: 75px;

    text-align: center;

}

/* =========================

   ボタン共通

========================= */

button {

    border: none;

    background: #222;

    color: #fff;

    border-radius: 25px;

    font-size: 16px;

}

button:active {

    background: #555;

}

/* =========================

   SET TIME

========================= */

.set-time-button {

    width: 110px;

    height: 42px;

    margin-top: 25px;

}

/* =========================

   ＋ −

========================= */

.controls {

    display: flex;

    gap: 25px;

    margin-top: 20px;

}

.controls button {

    width: 60px;

    height: 60px;

    border-radius: 50%;

    font-size: 30px;

}

/* =========================

   RESET

========================= */

.reset-button {

    width: 110px;

    height: 42px;

    margin-top: 25px;

}

/* =========================

   横向きでは

   ボタンを少し小さく

========================= */

@media (orientation: landscape) {

    .controls button {

        width: 50px;

        height: 50px;

        font-size: 25px;

    }

    .set-time-button {

        width: 100px;

        height: 38px;

        font-size: 14px;

    }

    .reset-button {

        width: 100px;

        height: 38px;

        font-size: 14px;

    }

}

</style>

</head>

<body>

<div class="container">

    <!-- =====================

         時間表示

    ====================== -->

    <div

        id="time"

        class="time"

        onclick="toggleTimer()">

        05:00

    </div>

    <!-- =====================

         時間設定

    ====================== -->

    <div

        id="setting"

        class="setting">

        <input

            id="minutes"

            type="number"

            min="0"

            placeholder="分">

        <span>分</span>

        <input

            id="seconds"

            type="number"

            min="0"

            max="59"

            placeholder="秒">

        <span>秒</span>

        <button

            onclick="setTime()">

            SET

        </button>

    </div>

    <!-- =====================

         SET TIME

    ====================== -->

    <button

        class="set-time-button"

        onclick="showSetting()">

        SET TIME

    </button>

    <!-- =====================

         ＋ −

    ====================== -->

    <div class="controls">

        <button

            onclick="changeTime(-60)">

            −

        </button>

        <button

            onclick="changeTime(60)">

            ＋

        </button>

    </div>

    <!-- =====================

         RESET

    ====================== -->

    <button

        class="reset-button"

        onclick="resetTimer()">

        RESET

    </button>

</div>

<script>

/* =========================

   タイマー変数

========================= */

let initialSeconds = 5 * 60;

let remainingSeconds =

    initialSeconds;

let timer = null;

let running = false;

/* =========================

   画面スリープ防止

========================= */

let wakeLock = null;

/*

   Wake Lockを取得

*/

async function requestWakeLock() {

    try {

        if (

            "wakeLock" in navigator

        ) {

            wakeLock =

                await navigator

                    .wakeLock

                    .request("screen");

        }

    } catch (error) {

        console.log(

            "Wake Lock error:",

            error

        );

    }

}

/*

   Wake Lockを解除

*/

async function releaseWakeLock() {

    if (wakeLock) {

        try {

            await wakeLock.release();

        } catch (error) {

            console.log(

                "Wake Lock release error:",

                error

            );

        }

        wakeLock = null;

    }

}

/*

   iPhoneに戻ってきた時、

   画面スリープ防止を再取得

*/

document.addEventListener(

    "visibilitychange",

    async function() {

        if (

            document.visibilityState ===

            "visible" &&

            running

        ) {

            await requestWakeLock();

        }

    }

);

/* =========================

   時間表示

========================= */

function formatTime(seconds) {

    let sign = "";

    if (seconds < 0) {

        sign = "-";

        seconds =

            Math.abs(seconds);

    }

    const minutes =

        Math.floor(seconds / 60);

    const secs =

        seconds % 60;

    return sign

        + String(minutes)

            .padStart(2, "0")

        + ":"

        + String(secs)

            .padStart(2, "0");

}

/* =========================

   表示更新

========================= */

function updateDisplay() {

    document

        .getElementById("time")

        .textContent =

        formatTime(

            remainingSeconds

        );

}

/* =========================

   START / STOP

========================= */

async function toggleTimer() {

    /*

       STOP

    */

    if (running) {

        clearInterval(timer);

        timer = null;

        running = false;

        await releaseWakeLock();

        return;

    }

    /*

       START

    */

    running = true;

    /*

       画面スリープ防止

    */

    await requestWakeLock();

    /*

       1秒ごとにカウント

    */

    timer = setInterval(

        function() {

            remainingSeconds--;

            updateDisplay();

        },

        1000

    );

}

/* =========================

   ＋ −

========================= */

function changeTime(amount) {

    if (running) {

        return;

    }

    initialSeconds += amount;

    if (initialSeconds < 0) {

        initialSeconds = 0;

    }

    remainingSeconds =

        initialSeconds;

    updateDisplay();

}

/* =========================

   時間設定

========================= */

function showSetting() {

    if (running) {

        return;

    }

    document

        .getElementById("setting")

        .style.display = "flex";

    document

        .getElementById("minutes")

        .value =

        Math.floor(

            initialSeconds / 60

        );

    document

        .getElementById("seconds")

        .value =

        initialSeconds % 60;

}

/* =========================

   時間設定確定

========================= */

function setTime() {

    if (running) {

        return;

    }

    const minutes =

        parseInt(

            document

                .getElementById("minutes")

                .value

        ) || 0;

    const seconds =

        parseInt(

            document

                .getElementById("seconds")

                .value

        ) || 0;

    initialSeconds =

        (minutes * 60)

        + seconds;

    remainingSeconds =

        initialSeconds;

    document

        .getElementById("setting")

        .style.display = "none";

    updateDisplay();

}

/* =========================

   RESET

========================= */

async function resetTimer() {

    clearInterval(timer);

    timer = null;

    running = false;

    await releaseWakeLock();

    remainingSeconds =

        initialSeconds;

    updateDisplay();

}

/* =========================

   初期表示

========================= */

updateDisplay();

</script>

</body>

</html>
