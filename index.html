<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Countdown Timer</title>

<style>

* {

box-sizing: border-box;

-webkit-tap-highlight-color: transparent;

}

html, body {

margin: 0;

padding: 0;

width: 100%;

height: 100%;

overflow: hidden;

background: #000;

color: #fff;

font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;

}

body {

display: flex;

justify-content: center;

align-items: center;

}

.container {

width: 100%;

height: 100%;

display: flex;

flex-direction: column;

justify-content: center;

align-items: center;

}

.time {

font-size: 22vw;

font-weight: 300;

letter-spacing: -0.05em;

font-variant-numeric: tabular-nums;

white-space: nowrap;

}

.time:active {

opacity: 0.6;

}

.controls {

display: flex;

gap: 25px;

margin-top: 35px;

}

button {

border: none;

background: #222;

color: white;

border-radius: 50%;

width: 65px;

height: 65px;

font-size: 32px;

}

button:active {

background: #555;

}

.main-buttons {

display: flex;

gap: 15px;

margin-top: 30px;

}

.main-buttons button {

width: 120px;

height: 55px;

border-radius: 30px;

font-size: 18px;

}

input {

background: #222;

color: white;

border: 1px solid #555;

border-radius: 10px;

padding: 12px;

font-size: 22px;

width: 90px;

text-align: center;

}

.setting {

display: none;

margin-top: 25px;

gap: 10px;

align-items: center;

}

.setting button {

width: 80px;

height: 50px;

border-radius: 25px;

font-size: 18px;

}

</style>

</head>

<body>

<div class="container">

<div id="time" class="time" onclick="showSetting()">05:00</div>

<div id="setting" class="setting">

<input id="minutes" type="number" min="0" placeholder="分">

<span>分</span>

<input id="seconds" type="number" min="0" max="59" placeholder="秒">

<span>秒</span>

<button onclick="setTime()">SET</button>

</div>

<div class="controls">

<button onclick="changeTime(-60)">−</button>

<button onclick="changeTime(60)">＋</button>

</div>

<div class="main-buttons">

<button onclick="startTimer()">START</button>

<button onclick="resetTimer()">RESET</button>

</div>

</div>

<script>

let initialSeconds = 5 * 60;

let remainingSeconds = initialSeconds;

let timer = null;

let running = false;

function formatTime(seconds) {

const minutes = Math.floor(seconds / 60);

const secs = seconds % 60;

return String(minutes).padStart(2, "0")

+ ":"

+ String(secs).padStart(2, "0");

}

function updateDisplay() {

document.getElementById("time").textContent =

formatTime(remainingSeconds);

}

function changeTime(amount) {

if (running) return;

initialSeconds += amount;

if (initialSeconds < 0) {

initialSeconds = 0;

}

remainingSeconds = initialSeconds;

updateDisplay();

}

function showSetting() {

if (running) return;

document.getElementById("setting").style.display = "flex";

document.getElementById("minutes").value =

Math.floor(initialSeconds / 60);

document.getElementById("seconds").value =

initialSeconds % 60;

}

function setTime() {

if (running) return;

const minutes =

parseInt(document.getElementById("minutes").value) || 0;

const seconds =

parseInt(document.getElementById("seconds").value) || 0;

initialSeconds =

(minutes * 60) + seconds;

remainingSeconds = initialSeconds;

document.getElementById("setting").style.display = "none";

updateDisplay();

}

function startTimer() {

if (running) return;

if (remainingSeconds <= 0) return;

running = true;

timer = setInterval(function() {

remainingSeconds--;

updateDisplay();

function startTimer() {

if (running) return;

if (remainingSeconds <= 0) return;

running = true;

timer = setInterval(function() {

remainingSeconds--;

updateDisplay();

}, 1000);

}

}, 1000);

}

function resetTimer() {

clearInterval(timer);

timer = null;

running = false;

remainingSeconds = initialSeconds;

updateDisplay();

}

updateDisplay();

</script>

</body>

</html>
